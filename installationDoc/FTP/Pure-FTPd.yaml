pureFTPd:
    https://www.raspberrypi.org/documentation/remote-access/ftp.md

    descr:
        FTP (File Transfer Protocol) can be used to transfer files between a Raspberry
        Pi and another computer.
        Although with default program sftp-server of Raspberry Pi OS the users with
        sufficient privilege can transfer files or directories, access to the filesystem
        of the limited users is also required often. Follow the steps below to set up an FTP server:

Install Pure-FTPd:
    sudo apt install pure-ftpd

Basic Configurations:
    descr:
        We need to create a new user group named ftpgroup and a new user named ftpuser for FTP users,
        and make sure this "user" has no login privilege and no home directory:

    cmd:
        sudo addgroup ftpgroup -gid 1200
        sudo useradd  ftpuser --uid 1200 -g ftpgroup -s /sbin/nologin -d /dev/null

FTP Home Directory, Virtual User, and User Group For instance, make a new directory named FTP for the first user:
    FTP_DIR='/mnt/Toshiba_1TB_LnDisk/FTP'
    sudo mkdir ${FTP_DIR}  #  by Loreto:  13-06-2020 07.53.15
    sudo mkdir ${FTP_DIR}/Silvia  #  by Loreto:  13-06-2020 07.53.15
    sudo mkdir ${FTP_DIR}/Laura  #  by Loreto:  13-06-2020 07.53.15


Make sure the directory is accessible for ftpuser:
    sudo chown -R ftpuser:ftpgroup ${FTP_DIR} #  by Loreto:  13-06-2020 07.54.45


Create a virtual user named camera, mapping the virtual user to ftpuser and ftpgroup setting home directory /home/pi/FTP, and record password of the user in database:
    sudo pure-pw useradd camera -u ftpuser -g ftpgroup -d ${FTP_DIR} -m  #  by Loreto:  13-06-2020 07.57.54


A password of that virtual user will be required after this command line is entered. And next, set up a virtual user database by typing:
    sudo pure-pw mkdb


Last but not least, define an authentication method by making
a link of file /etc/pure-ftpd/conf/PureDB,
the number 60 is only for demonstration, make it as small as necessary:

    sudo ln -s /etc/pure-ftpd/conf/PureDB /etc/pure-ftpd/auth/60puredb

Restart the program:

    sudo service pure-ftpd restart

Test it with an FTP client, like FileZilla.

More Detailed Configurations:
The configuration of Pure-FTPd is simple and intuitive.
The administrator only needs to define the necessary settings
by making files with option names, like ChrootEveryone, and typing yes,
then storing in the directory /etc/pure-ftpd/conf,
if all FTP users are to be locked in their FTP home directory (/home/pi/FTP).
Here are some recommended settings:

    sudo vi /etc/pure-ftpd/conf/ChrootEveryone and typing yes


Likewise,

    sudo vi /etc/pure-ftpd/conf/AnonymousCanCreateDirs and type no;
    sudo vi /etc/pure-ftpd/conf/AnonymousCantUpload and type yes;
    sudo vi /etc/pure-ftpd/conf/DisplayDotFiles and type no;
    sudo vi /etc/pure-ftpd/conf/DontResolve and type yes;
    sudo vi /etc/pure-ftpd/conf/FSCharset and type UTF-8;
    sudo vi /etc/pure-ftpd/conf/NoAnonymous and type yes;
    sudo vi /etc/pure-ftpd/conf/ProhibitDotFilesRead and type yes;
    sudo vi /etc/pure-ftpd/conf/ProhibitDotFilesWrite and type yes;

...

Restart pure-ftpd again and apply the above settings.

    sudo service pure-ftpd restart
For more information of Pure-FTPd and documentation, please get on official website of Pure-FTPd.