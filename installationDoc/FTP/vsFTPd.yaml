    sudo systemctl restart vsftpd && sudo systemctl status vsftpd




problems 500 OOPS vsftpd refusing to run with writable root inside chroot():
    ref:
        - https://www.liquidweb.com/kb/error-500-oops-vsftpd-refusing-to-run-with-writable-root-inside-chroot-solved/

        Alternatively, you can bypass the writable check in the vsftpd config file by running the following command.
        echo 'allow_writeable_chroot=YES' >> /etc/vsftpd/vsftpd.conf && systemctl restart vsftpd



