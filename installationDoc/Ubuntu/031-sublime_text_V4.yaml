
ref:
    https://tecadmin.net/how-to-install-sublime-text-on-ubuntu-22-04/

install:
    First of all, install a few required packages before proceeding next steps:
        sudo apt update && sudo apt upgrade

    Now, import the GPG key to the systems trusted GPG directory:
        sudo apt install gnupg2 wget ca-certificates lsb-release software-properties-common
        wget -nc https://download.sublimetext.com/sublimehq-pub.gpg

    Now, import the GPG key to the systems trusted GPG directory:
        cat sublimehq-pub.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/sublimehq-pub.gpg >/dev/null

        sudo add-apt-repository "deb https://download.sublimetext.com/ apt/stable/"

        sudo apt update
        sudo apt install sublime-text

    prima di lanciarlo copiare $HOME/.config/sublime-text dal disco esterno sulla home dell'utente

     # --- EDITOR
    sudo apt install vim

    set:
        sudo update-alternatives --config  editor
        sudo update-alternatives --install /usr/bin/editor  editor  /bin/nano 1
        sudo update-alternatives --install /usr/bin/editor  editor  /usr/bin/vim 2
        sudo update-alternatives --install /usr/bin/editor  editor  /usr/bin/subl 3