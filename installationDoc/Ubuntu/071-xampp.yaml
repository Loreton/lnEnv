config:
    add in hosts:
        127.0.0.5       website01

    create path struct:
        sudo mkdir -p /var/wwww/website01
        sudo mkdir -p /var/wwww/website01/php
        sudo mkdir -p /var/wwww/website01/html
        sudo mkdir -p /var/wwww/website01/images
        sudo mkdir -p /var/wwww/website01/conf

        apache configuration file:
            /opt/lampp/etc/httpd.conf

        sudo cp /opt/lampp/etc/extra/httpd-vhosts.conf /var/wwww/website01/conf/httpd-vhosts.conf
        sudo chgrp loreto /var/wwww/website01/conf/httpd-vhosts.conf
        sudo chmod g+w /var/wwww/website01/conf/httpd-vhosts.conf

    create index.php:
        sudo touch /var/wwww/website01/index.php
        sudo chgrp loreto /var/wwww/website01/index.php
        sudo chmod g+w /var/wwww/website01/index.php
        add linde:
            <?php
                phpinfo( );
            ?>



    add:
        <VirtualHost 127.0.0.5:80>
            DocumentRoot "/var/wwww/website01"
            DirectoryIndex index.php

            <Directory "/var/wwww/website01">
                Options All
                AllowOverride All
                Require all granted
            </Directory>
        </VirtualHost>




    vhosts:
