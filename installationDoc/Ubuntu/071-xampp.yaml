Install:
    chmod +x xampp-linux-x64-8.2.12-0-installer.run
    sudo ./xampp-linux-x64-8.2.12-0-installer.run

    Important:
        If the services fail to start, make sure that the net-tools utility is installed on your system:
        To install net-tools, run the command below:
            sudo apt install net-tools

    Verify localhost is working by entering the following URL in a browser:
        http://localhost/dashboard
        http://localhost/phpmyadmin


