weasis:
# A free/libre/open medical DICOM viewer
# Weasis is a multipurpose standalone and web-based DICOM viewer with a highly modular architecture.
# It is a very popular clinical viewer used in healthcare by hospitals, health networks, multicenter research trials, and patients.
   ref:
      https://flathub.org/apps/io.github.nroduit.Weasis
   install:
      flatpak install flathub io.github.nroduit.Weasis
   run:
      flatpak run io.github.nroduit.Weasis

   Se da errore Caused by java.awt.HeadlessException:
      No X11 DISPLAY variable was set,
      or no headful library support was found,
      but this program performed an operation which requires it,

      ref: https://github.com/nroduit/Weasis/issues/449
      As the X11 fallback seems buggy, the workaround with Flatpak is:
      run flatpak run --socket=x11 --nosocket=wayland io.github.nroduit.Weasis

      or
      Install Flatseal:
         flatpak install flathub com.github.tchx84.Flatseal

