ubuntu:
    https://docs.arduino.cc/software/ide-v2/tutorials/getting-started/ide-v2-downloading-and-installing/

    download appimage from:
        https://www.arduino.cc/en/software

    In case you cannot run the AppImage file, make sure that FUSE is installed on your system:
        https://github.com/AppImage/AppImageKit/wiki/FUSE
        # sudo add-apt-repository universe
        # sudo apt install libfuse2

    To enable the Arduino IDE to access the serial port and upload code to your board, the following rule can be added to:
        sudo vi /etc/udev/rules.d/99-arduino.rules
        SUBSYSTEMS=="usb", ATTRS{idVendor}=="2341", GROUP="plugdev", MODE="0666"


    ./arduino-ide_2.3.4_Linux_64bit.AppImage --no-sandbox # as loreto user

