

# Tasmota_sonoff
#  Partire da:
#       https://github.com/arendst/Tasmota/wiki
#  https://github.com/arendst/Sonoff-Tasmota/wiki/Arduino-IDE
#      IMPORTANT: For Windows users, before executing arduino.exe add an empty folder called portable in the known folder.
#
#       Install ESP8266 board software
#         Open Arduino IDE and select File → Preferences and add the following text
#               for field Additional Boards Manager URLs: http://arduino.esp8266.com/stable/package_esp8266com_index.json and select OK.
#         Open Tools → Boards... → Boards Manager... and scroll down and click on esp8266 by ESP8266 Community.
#               Click the Install button to download and install the latest ESP8266 board software. Select Close.
#
#       Download Tasmota
#           Download the latest Tasmota release Source code from
#               https://github.com/arendst/Sonoff-Tasmota/releases and unzip to another known folder.
# cutecom come monitore seriale

https://tasmota.github.io/docs/devices/Sonoff-Basic/


Backlog
topic TelecameraLetto; FriendlyName TelecameraLetto; DeviceName TelecameraLetto;
mqtthost lnmqtt.duckdns.org; mqttport 1883; mqttuser Loreto; mqttpassword LoretoMqtt;
SSID1 Casetta; Password1 xxxx.Adsl; SSID2 LoretoHotSpot; Password2 Loretohs;

PowerOnState 0; SetOption63 0; SwitchRetain 0; ButtonRetain 0; SetOption26 1
Teleperiod 30; SetOption50 1;
timezone 99; latitude 42.291476; longitude 12.957694; altitude 800;

# wifi stability
Backlog
SetOption56 1;
SetOption57 1;
SetOption65 1;
WifiPower 17;
WifiConfig 5;
Rule3 0;
Rule3
ON System#Boot DO Backlog RuleTimer4 86400 ENDON
ON Rules#Timer=4 DO Backlog Restart 1; RuleTimer4 86400 ENDON
ON Wifi#Disconnected DO RuleTimer3 900 ENDON
ON Wifi#Connected DO RuleTimer3 0 ENDON
ON Rules#Timer=3 DO Restart 1 ENDON;
Rule3 1;
