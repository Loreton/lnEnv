dhcpdcd.conf di LnPi22 che contiene il server dnsmasq

Questo premette di avere il fallback eth0 in caso di mancanza di dhcp

dhcpdcd.conf:
    profile static_eth0
    static ip_address=192.168.1.22/24
    static routers=192.168.1.1
    static domain_name_servers=192.168.1.22 1.1.1.1

    # fallback to static profile on eth0
    interface eth0
    fallback static_eth0