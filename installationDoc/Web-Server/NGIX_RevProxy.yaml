DOC:
    https://engineerworkshop.com/blog/setup-an-nginx-reverse-proxy-on-a-raspberry-pi-or-any-other-debian-os/

Install:
    https://pimylifeup.com/raspberry-pi-lighttpd/

    sudo apt-get update
    sudo apt-get upgrade
    sudo apt-get remove apache2
    sudo apt-get remove lighttpd
    sudo apt-get install nginx





    sudo systemctl start nginx
    nginx -V | grep -i debug
    nginx -V | grep -i python


    sudo adduser www-data pi #

Config:
    cd /etc/nginx/sites-available/
    sudo vi example.com.conf
    add:
        server {
            listen 80;
            server_name example.com;
            location / {
            proxy_pass http://192.x.x.2;
            }
        }

    ln -s /etc/nginx/sites-available/example.com.conf /etc/nginx/sites-enabled/example.com.conf﻿
    sudo nginx -t
    sudo systemctl reload nginx

    sudo vi loretoVH.conf
        server {
            listen 80;
            server_name loretoVH.casetta;
            location / {
            proxy_pass http://192.x.x.2;
            }
        }
    ln -s /etc/nginx/sites-available/loretoVH.conf /etc/nginx/sites-enabled/loretoVH.conf
    sudo nginx -t
    sudo systemctl reload nginx


