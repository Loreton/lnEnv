# https://shelly-api-docs.shelly.cloud/#shelly1-pm-overview

MQTT:
    shellies/<deviceid>/relay/0: to report status on, off
    shellies/<deviceid>/input/0: reports the state of the SW terminal
    shellies/<deviceid>/longpush/0: reports longpush state as 0 (shortpush) or 1 (longpush)
    shellies/<deviceid>/input_event/0:
        reports input event and event counter, e.g.
            {"event":"S","event_cnt":2} see /status for details

    shellies/<deviceid>/relay/0/command:
        on, off, toggle

    state:
        Device state is reported periodically, every 30 seconds by default.
        This can be changed by setting a new period for updates:
            mqtt_update_period under /settings.
            A value of 0 will disable periodic updates.


WEB:
    http://192.168.1.61/status

    http://192.168.1.61/relay/0/?turn=on
    http://192.168.1.61/settings/0/?turn=on
    /settings?mqtt_update_period={seconds}
    /settings?mqtt_id=topic_name