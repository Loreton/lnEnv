Comandi per tasmota:
    ci sono tre prefix:
        tele/#
        stat/#
        cmnd/#

    power status:
        stat/tasmota_01/POWER
        Es.:
            mosquitto_sub -d -u Loreto -P LoretoMqtt -t stat/tasmota_01/POWER

    power toggle:
            mosquitto_pub -d -u Loreto -P LoretoMqtt -t cmnd/tasmota_01/POWER -m toggle

    tele/tasmota_01:
        LWT = Online
        INFO1 = {"Module":"Sonoff Basic","Version":"9.1.0(tasmota)","FallbackTopic":"cmnd/DVES_92DFAF_fb/","GroupTopic":"cmnd/tasmotas/"}
