Loreto:
    preparare l'ambiente python
    .venv.generic312

    poi proseguire con l'installazione. considerare che platformio crea un uso ambiente virtuale nella directory
    ${HOME}/.platformio/penv




ref:
    https://docs.platformio.org/en/latest/core/quickstart.html#setting-up-the-project

installation:
    re:
         https://docs.platformio.org/en/latest/core/installation/methods/installer-script.html
    wget -O get-platformio.py https://raw.githubusercontent.com/platformio/platformio-core-installer/master/get-platformio.py


    python3 get-platformio.py
    se da errorre forse è necessario dare il comando:
        sudo apt install python3.12-venv

    # aggiungere neel path
    [[ -d "${HOME}/.platformio/penv/bin" ]] && myPath="${myPath}:${HOME}/.platformio/penv/bin"

esspressif32:
    https://registry.platformio.org/platforms/platformio/espressif32/installation


CLI:
    pio run  Process (build) all environments specified in “platformio.ini” (Project Configuration File)

    pio run --target upload. Build project and upload firmware to the all devices specified in “platformio.ini” (Project Configuration File)

    pio run --target clean. Clean project (delete compiled objects)

    pio run -e uno. Process only uno environment

    pio run -e uno -t upload. Build project only for uno and upload firmware.
    pio device monitor


struct:
    project_dir
    ├── lib
    │   └── README
    ├── platformio.ini
    └── src
        └── main.cpp

