install:
    sudo apt update && sudo apt upgrade
    sudo apt install rclone -y

paths:
    /mnt/k/Filu/LnDisk/LnFree/SynchBackup/rClone_WSL
    k:\Filu\LnDisk\LnFree\SynchBackup\rClone_WSL
    k:\Filu\LnDisk\LnFree\SynchBackup\rClone_Win

raspberry:
    wget https://downloads.rclone.org/rclone-current-linux-arm.zip


    # https://rclone.org/docs/
    # https://rclone.org/drive/  for google driveww
config:
