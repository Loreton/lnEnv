update1:
    ref1:
       https://tecadmin.net/how-to-install-sublime-text-on-ubuntu-22-04/

       sudo apt update && sudo apt install gnupg2 wget ca-certificates lsb-release software-properties-common
       wget -nc https://download.sublimetext.com/sublimehq-pub.gpg

       cat sublimehq-pub.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/sublimehq-pub.gpg >/dev/null

       sudo add-apt-repository "deb https://download.sublimetext.com/ apt/stable/"

       sudo apt update && sudo apt install sublime-text

       sudo apt remove --purge sublime-text

update2:
    ref: https://www.sublimetext.com/docs/linux_repositories.html

    action: 
       - sudo apt update
        - wget -qO - https://download.sublimetext.com/sublimehq-pub.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/sublimehq-archive.gpg > /dev/null
        - echo "deb https://download.sublimetext.com/ apt/stable/" | sudo tee /etc/apt/sources.list.d/sublime-text.list

        sudo apt update && sudo apt install sublime-text

       sudo apt remove --purge sublime-text



    prima di lanciarlo copiare $HOME/.config/sublime-text dal disco esterno sulla home dell'utente
    # --- EDITOR
    cmd: sudo update-alternatives --install /usr/bin/editor  editor  /bin/nano 1
    cmd: sudo update-alternatives --install /usr/bin/editor  editor  /usr/bin/vim 2
    cmd: sudo update-alternatives --install /usr/bin/editor  editor  /usr/bin/subl 3