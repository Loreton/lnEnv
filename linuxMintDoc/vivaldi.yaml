vivaldi browser:
        If you are using Ubuntu, Debian, or any Debian-based Linux distribution such as Linux Mint or Pop!_OS,
        you can easily install Vivaldi browser through the terminal using a quick and effective approach.
        Unlike most browsers, Vivaldi has a .deb package for effortless installation.

        Execute the following command to download the current stable version of Vivaldi from its official website:
        wget https://downloads.vivaldi.com/stable/vivaldi-stable_amd64.deb
        sudo dpkg -i vivaldi-stable_amd64.deb






