kid3: # anche tag editor
    tip:
        se installato con flatpack non vede le directory.
        per farle vedere usare il comando:
            flatpak override --user org.kde.kid3 --filesystem=/home/loreto/filu/myData/Songs
            dove come filesystem mettere il path che si desidera

    ref:
        https://flathub.org/en/apps/org.kde.kid3

    install:
        flatpak install flathub org.kde.kid3

    run:
        flatpak run org.kde.kid3


