xbindkeys:
    ref:
        https://www.nongnu.org/xbindkeys/

        https://mauriziosiagri.wordpress.com/tag/xbindkeys-config/

    install:
        sudo apt-get install xbindkeys
        xbindkeys --defaults > $HOME/.xbindkeysrc

    start:
        /usr/bin/xbindkeys

    restart:
        killall -HUP xbindkeys
    
    other:
        # prompt to capture shortcut
        xbindkeys  -k
        # current keys
        xbindkeys_show


