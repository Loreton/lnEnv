        Configurazione Aggiuntiva (Importante):
            Per connetterti da remoto prima di aver effettuato il login, RustDesk necessita spesso di configurazioni aggiuntive

            Abilita l'avvio Headless: 
                All'interno dell'applicazione RustDesk, cerca un'opzione per "headless linux" o funzionalità simili 
                (questo è spesso necessario per sistemi senza monitor o in cui si vuole accedere alla schermata di login).

            Imposta una Password Permanente: 
                Configura una password permanente (o fissa) nelle impostazioni di RustDesk. 
                Questo ti permetterà di accedere al sistema quando si trova sulla schermata di login, 
                dove la normale conferma non è possibile.


Note: per ezbook-silvia ho adottato il metodo sopra perchè insieme all'impostazione RTC
      nel bios mi permette di avere il pc sempre acceso con la partenza di rustDesk all'avvio anche senza login


rustdesk - Flatpak:
    ref:
        https://flathub.org/en/apps/com.rustdesk.RustDesk

    install:
        flatpak install flathub com.rustdesk.RustDesk

    run:
        flatpak run com.rustdesk.RustDesk




# ========================================================
# 2. Avviare RustDesk automaticamente dopo il login
# ========================================================

Flatpak installa RustDesk come comando:
    flatpak run com.rustdesk.RustDesk


## Metodo 2: autostart manuale
Crea il file:
    mkdir -p ~/.config/autostart
    vi ~/.config/autostart/rustdesk.desktop


Inserisci:

```
[Desktop Entry]
Type=Application
Name=RustDesk
Exec=flatpak run com.rustdesk.RustDesk
X-GNOME-Autostart-enabled=true
```
Salva e chiudi.


# ========================================================
#  RISULTATO
# ========================================================

✔ Alla partenza il PC effettuerà **autologin**
✔ Appena aperta la sessione utente, RustDesk Flatpak partirà automaticamente
✔ Potrai collegarti al PC senza toccarlo
