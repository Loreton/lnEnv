rustdesk - .deb:
    ref:
        https://flathub.org/en/apps/com.rustdesk.RustDesk

    install:
        Scarica il pacchetto .deb (sostituisci il numero di versione con l'ultima disponibile):
        wget https://github.com/rustdesk/rustdesk/releases/download/1.4.4/rustdesk-1.4.4-aarch64.deb

        nstalla il pacchetto e correggi le dipendenze:
        sudo dpkg -i rustdesk-1.4.4-aarch64.deb
        sudo apt --fix-broken install


        sudo systemctl enable rustdesk.service
        sudo systemctl start rustdesk.service
        systemctl status rustdesk.service
