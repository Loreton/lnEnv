Quali sono le caratteristiche principali da valutare in un biotrituratore elettrico?:

    Potenza e Capacità di Taglio:
        Potenza motore: da 2.500W a 3.100W per uso domestico
        Diametro massimo rami: tipicamente 40-45mm per modelli domestici
        Tipo di motore: brushless per maggiore durata e meno manutenzione

    Sistema di Taglio:
        Lame reversibili: permettono taglio bidirezionale e maggiore durata
        Sistema a turbina: più efficiente per grandi quantità (es. Bosch AXT)
        Sistema a rullo: più silenzioso e meno inceppamenti

    Capacità e Praticità:
        Contenitore raccolta: da 40L a 60L per ridurre svuotamenti
        Peso e mobilità: ruote larghe e maniglie ergonomiche
        Livello rumorosità: modelli silenziosi da 88-95 dB
    Sicurezza:
        Protezione sovraccarico: spegnimento automatico
        Interruttore di sicurezza: blocca funzionamento se aperto
        Funzione inversione: per liberare inceppamenti
        Tramoggia con chiusura: impedisce accesso accidentale alle lame



Differenze tra sistema a lame e turbina:
    Sistema a Lame:
        Principio: Taglio netto con lame rotanti ad alta velocità
        Ideale per: Rami verdi, siepi, materiale fresco e umido
        Vantaggi: Taglio preciso, buona qualità del cippato
        Svantaggi: Più rumoroso, richiede affilatura periodica delle lame
        Manutenzione: Lame da sostituire/affilare ogni stagione

    Sistema a Turbina (Rullo dentato):
        Principio: Schiacciamento e frantumazione con rullo dentato
        Ideale per: Rami secchi, legno duro, materiale di varie dimensioni
        Vantaggi: Più silenzioso (fino a 10 dB in meno), meno inceppamenti
        Svantaggi: Cippato meno uniforme, può essere più lento
        Manutenzione: Minore, solo pulizia periodica

    Quale Scegliere:
        Lame: Se lavori principalmente con potature fresche e vuoi cippato uniforme
        Turbina: Se priorità sono silenziosità e varietà di materiali da triturare


