# Virtual Hosts
#
# Required modules: mod_log_config

# If you want to maintain multiple domains/hostnames on your
# machine you can setup VirtualHost containers for them. Most configurations
# use only name-based virtual hosts so the server doesn't need to worry about
# IP addresses. This is indicated by the asterisks in the directives below.
#
# Please see the documentation at 
# <URL:http://httpd.apache.org/docs/2.4/vhosts/>
# for further details before you try to setup virtual hosts.
#
# You may use the command line option '-S' to verify your virtual host
# configuration.

#
# VirtualHost example:
# Almost any Apache directive may go into a VirtualHost container.
# The first VirtualHost section is used for all requests that do not
# match a ServerName or ServerAlias in any <VirtualHost> block.
#
# # @Ln_changed:  31-10-2024 17:01:11
# ref: https://ourcodeworld.com/articles/read/302/how-to-setup-a-virtual-host-locally-with-xampp-in-ubuntu
#

<VirtualHost 127.0.0.1:80>
    ServerAdmin webmaster@dummy-host.example.com
    ServerName dummy-host.example.com
    DocumentRoot "/home/loreto/lnprofile/xampp/www/prj01"
    DirectoryIndex index.php
    ServerAlias loreto01 loreto02

    # if you want this vhost to listen to extra names, uncomment the next line


    CustomLog logs/access.log combined
    ErrorLog  logs/error.log

    <Directory "/home/loreto/lnprofile/xampp/www/prj01">
        Options All
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>


# listen website01:80

<VirtualHost website01:80>
    # ref: /opt/lampp/etc/httpd.conf
    DocumentRoot "/var/www/website01"
    DirectoryIndex index.php

    #
    # LogLevel: Control the number of messages logged to the error_log.
    # Possible values include: debug, info, notice, warn, error, crit,
    # alert, emerg.
    # loreto: ho totato che il log vuol il percorso completo
    #
    LogLevel info
    ErrorLog "/var/www/website01/logs/error_log"
    CustomLog "/var/www/website01/logs/access_log" common

    <Directory "/var/www/website01">
        Options All
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
